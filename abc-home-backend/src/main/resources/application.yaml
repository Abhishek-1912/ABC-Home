server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]   # loads KEY=VALUE from .env for local dev
  application:
    name: abc-home-backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  storage-bucket: product-images

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.abchome: DEBUG